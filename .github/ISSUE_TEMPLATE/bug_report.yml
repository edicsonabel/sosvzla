name: 🐛 Reportar un bug
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. Si es una **vulnerabilidad de seguridad**, NO la
        publiques aquí — sigue [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué pasa?
      description: Describe el bug con claridad.
      placeholder: Al pulsar "Reportar SOS" sin GPS, la pantalla se queda en blanco.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ir a /sos
        2. Negar permiso de ubicación
        3. Rellenar el formulario y enviar
        4. Ver el error
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
    validations:
      required: true
  - type: dropdown
    id: dispositivo
    attributes:
      label: Dispositivo
      options:
        - Móvil Android
        - Móvil iPhone
        - Escritorio
        - Otro
    validations:
      required: false
  - type: input
    id: navegador
    attributes:
      label: Navegador y versión
      placeholder: Chrome 120, Safari iOS 17...
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o consola
      description: Arrastra imágenes aquí, o pega errores de la consola del navegador.
